name: Test Password Generator

on:
  workflow_dispatch:

jobs:
  generar:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Generar contraseña
        id: password
        uses: ./PasswordGenerator
        with:
          Longitud: 10

      - name: Mostrar resultado
        run: |
          Write-Host "Contraseña: ${{ steps.password.outputs.resultado }}"
        shell: pwsh
